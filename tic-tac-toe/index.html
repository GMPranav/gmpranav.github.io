<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@300&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../static/navbar.css">
    <script src="../static/projects-data.js"></script>
    <script src="../static/navbar.js" defer></script>
</head>

<body>
    <gmp-navbar active="tictactoe"></gmp-navbar>
    <div class="game-arena">
        <div id="x-marker">X</div>
    <div id="wrapper">
        <div id="title">
            <h1><strong>Tic-Tac-Toe</strong></h1>
        </div>

        <div id="board">
            <!-- Game board will be dynamically generated here -->
            <div class="row">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>
            <div class="row">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>
            <div class="row">
                <div class="square"></div>
                <div class="square"></div>
                <div class="square"></div>
            </div>
        </div>

        <div id="status">
            <h3>X's turn</h3>
            <!-- Game status will be updated here (e.g., player turn, winner) -->
        </div>

        <div id="restart">
            <button id="restart-btn" class="btn btn-dark" onclick="handleRestart()">Restart</button>
        </div>
    </div>
    <div id="o-marker">O</div>
    </div>

    <script src="app.js"></script>
</body>

</html>
